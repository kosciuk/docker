[www]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; VPS con 8GB RAM compartidos entre varios proyectos; auth es un servicio
; chico (Slim + Doctrine, ~40-60MB por worker) asi que no acapara memoria.
pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

clear_env = no
