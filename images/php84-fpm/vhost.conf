# El contenedor sólo recibe tráfico a través de shared-gateway, que agrega
# X-Forwarded-For. Sin esto, REMOTE_ADDR sería siempre la IP del gateway y las
# apps no podrían distinguir un visitante de otro (rate limits, logs, auditoría).
#
# RemoteIPTrustedProxy es imprescindible: limita a qué origen se le cree el
# header. Las redes de abajo son los rangos privados donde vive Docker, no
# alcanzables desde internet, así que sólo el gateway puede fijar ese valor.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16
RemoteIPTrustedProxy 10.0.0.0/8

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # %a en vez del %h de "combined": con mod_remoteip %h sigue siendo el proxy.
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
    CustomLog ${APACHE_LOG_DIR}/access.log proxied
</VirtualHost>
