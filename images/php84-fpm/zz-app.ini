; Overrides sobre php.ini-production para el entorno de contenedor

; --- Entorno ---
; php.ini-production trae variables_order="GPCS" (sin la "E"), así que $_ENV
; queda vacío pese a que las variables de entorno del contenedor sí existen
; (getenv() las ve, $_ENV no). Restaura el comportamiento estándar.
variables_order = "EGPCS"

; Sin date.timezone PHP ya asumía UTC, así que esto no cambia nada: lo vuelve
; explícito para que no dependa de un default ni de la TZ del contenedor.
;
; UTC y no la zona local por como se persisten las fechas: donde se usa
; datetime_immutable (liberamerkato: 12 mappings, 39 columnas DATETIME) el
; valor se guarda sin offset, asi que la zona en la que se genero no queda
; registrada en ningun lado. Con todo en UTC esas fechas son comparables entre
; si, y la conversion a hora local se hace al mostrar, en el frontend, que ya
; sabe la zona del usuario. Cambiar esto a America/Argentina/Buenos_Aires
; dejaria los registros nuevos corridos tres horas respecto de los viejos, en
; la misma columna y sin forma de distinguirlos.
;
; Donde se guarde un timestamp entero da lo mismo: un epoch es absoluto. Pero
; entonces esta linea tampoco molesta.
;
; La TZ del compose es otra cosa: afecta los timestamps de los logs del
; contenedor, no las fechas que la aplicación persiste.
date.timezone = UTC

; --- Seguridad ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; --- Opcache: validar timestamps solo si el volumen puede cambiar en caliente ---
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
