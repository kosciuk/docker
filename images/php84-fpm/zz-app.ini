; Overrides sobre php.ini-production para el entorno de contenedor

; --- Seguridad ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; --- Opcache: validar timestamps solo si el volumen puede cambiar en caliente ---
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
