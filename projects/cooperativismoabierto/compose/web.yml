name: cooperativismoabierto

services:
  web:
    image: httpd:2.4
    container_name: cooperativismoabierto-web
    restart: unless-stopped
    command: >
      sh -c "echo 'Include conf/extra/rewrite.conf' >> /usr/local/apache2/conf/httpd.conf
      && httpd-foreground"
    volumes:
      - /var/www/cooperativismoabierto/www:/usr/local/apache2/htdocs
      - /var/www/docker/projects/cooperativismoabierto/config/rewrite.conf:/usr/local/apache2/conf/extra/rewrite.conf:ro
    networks:
      - projects_public

networks:
  projects_public:
    external: true
    name: projects_public
