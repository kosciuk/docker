name: impuestounico

services:
  api:
    build:
      context: /var/www/docker
      dockerfile: images/php84-fpm/Dockerfile
    container_name: impuestounico-api
    restart: unless-stopped
    # Ojo: a diferencia de enforos/liberamerkato, la API de este proyecto NO
    # arma la conexión con estas variables. config/common.php fija host
    # 'localhost' y dbname 'impuestounico' con user/password null, y eso se
    # pisa desde config/config.php (que no se versiona). Estas variables
    # quedan para APP_ENV / TZ / COMPOSER_AUTH y para el JWT; los datos de
    # la base van en config.php con host: shared-mysql.
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: ${DB_HOST:-shared-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-impuestounico}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      APP_URL: ${APP_URL:-https://api.impuestounico.com.ar}
      COMPOSER_AUTH: ${COMPOSER_AUTH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.impuestounico.com.ar}
    volumes:
      - /var/www/impuestounico/api:/var/www/html
      - impuestounico_api_cache:/var/www/html/var/cache
      - impuestounico_api_vendor:/var/www/html/vendor
      - /var/www/impuestounico/img:/var/www/impuestounico/img
      - /var/www/impuestounico/logs:/var/www/impuestounico/logs
      - /var/www/docker/projects/impuestounico/config/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    networks:
      - shared_services
      - projects_public

  app:
    build:
      context: /var/www/docker
      dockerfile: images/apache-static/Dockerfile
    container_name: impuestounico-app
    restart: unless-stopped
    volumes:
      - /var/www/impuestounico/app:/usr/local/apache2/htdocs
    networks:
      - projects_public

  img:
    build:
      context: /var/www/docker
      dockerfile: images/apache-static/Dockerfile
    container_name: impuestounico-img
    restart: unless-stopped
    volumes:
      - /var/www/impuestounico/img:/usr/local/apache2/htdocs
    networks:
      - projects_public

  www:
    build:
      context: /var/www/docker
      dockerfile: images/apache-static/Dockerfile
    container_name: impuestounico-www
    restart: unless-stopped
    volumes:
      - /var/www/impuestounico/www:/usr/local/apache2/htdocs
    networks:
      - projects_public

volumes:
  impuestounico_api_cache:
  impuestounico_api_vendor:

networks:
  shared_services:
    external: true
    name: shared_services
  projects_public:
    external: true
    name: projects_public
