name: partidodelasoledad

services:
  api:
    build:
      context: /var/www/docker
      dockerfile: images/php84-fpm/Dockerfile
    container_name: partidodelasoledad-api
    restart: unless-stopped
    # Ojo: a diferencia de enforos/liberamerkato, la API de este proyecto NO
    # arma la conexión con estas variables. config/common.php fija host
    # 'localhost' y dbname 'pdls' con user/password null, y eso se pisa desde
    # config/config.php (que no se versiona). Estas variables quedan para
    # APP_ENV / TZ / COMPOSER_AUTH y para el JWT; los datos de la base van
    # en config.php con host: shared-mysql.
    environment:
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      COMPOSER_AUTH: ${COMPOSER_AUTH}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.partidodelasoledad.com.ar}
    volumes:
      - /var/www/partidodelasoledad/api:/var/www/html
      - partidodelasoledad_api_cache:/var/www/html/var/cache
      - partidodelasoledad_api_vendor:/var/www/html/vendor
      - /var/www/partidodelasoledad/img:/var/www/partidodelasoledad/img
      - /var/www/partidodelasoledad/logs:/var/www/partidodelasoledad/logs
      - /var/www/docker/projects/partidodelasoledad/config/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    networks:
      - shared_services
      - projects_public

  app:
    build:
      context: /var/www/docker
      dockerfile: images/apache-static/Dockerfile
    container_name: partidodelasoledad-app
    restart: unless-stopped
    volumes:
      - /var/www/partidodelasoledad/app/dist:/usr/local/apache2/htdocs
    networks:
      - projects_public

  img:
    build:
      context: /var/www/docker
      dockerfile: images/apache-static/Dockerfile
    container_name: partidodelasoledad-img
    restart: unless-stopped
    volumes:
      - /var/www/partidodelasoledad/img:/usr/local/apache2/htdocs
    networks:
      - projects_public

  www:
    build:
      context: /var/www/docker
      dockerfile: images/apache-static/Dockerfile
    container_name: partidodelasoledad-www
    restart: unless-stopped
    volumes:
      - /var/www/partidodelasoledad/www:/usr/local/apache2/htdocs
    networks:
      - projects_public

volumes:
  partidodelasoledad_api_cache:
  partidodelasoledad_api_vendor:

networks:
  shared_services:
    external: true
    name: shared_services
  projects_public:
    external: true
    name: projects_public
