# auth.linkedcode.com — servidor OAuth
#
# auth y www comparten projects/linkedcode/compose/web.yml, pero son
# aplicaciones independientes: acá se nombra sólo el servicio auth, así que un
# `up -d auth` deja intacto a linkedcode-www.
#
# También comparten PROJECT="linkedcode" con linkedcode-www.conf: el default
# del motor para CONTAINERS/MIGRATE_CONTAINER ($PROJECT-api) no sirve para
# ninguno de los dos, por eso ambos nombran CONTAINERS explícito.
PROJECT="linkedcode"

ROOT="/var/www/linkedcode"
COMPOSE="/var/www/docker/projects/linkedcode/compose/web.yml"
ENV_FILE="/var/www/docker/projects/linkedcode/env/web.env"

SERVICES=(auth)
CONTAINERS=(linkedcode-auth)

# El gateway escribe acá el ErrorLog/CustomLog de los vhosts de linkedcode.
DATA_DIRS=(logs)

DB_NAME="linkedcode_auth"

REPOS=("/var/www/linkedcode/auth.linkedcode.com|git@github-linkedcode:linkedcode/auth.git")
USES_COMPOSER=1
MIGRATE_CONTAINER="linkedcode-auth"

REQUIRED_FILES=(
    "/var/www/linkedcode/auth.linkedcode.com/config/common.php|obligatorio para notenv (Loader::load): debería venir versionado con el repo"
    "/var/www/linkedcode/auth.linkedcode.com/config/config.prod.php|no se versiona: crearlo a mano (ver README)"
)

KEYPAIR_DIR="/var/www/linkedcode/auth.linkedcode.com/config"

PLACEHOLDERS='^(DB_PASS|COMPOSER_AUTH)=[[:space:]]*$|GITHUB_PAT_AQUI|^DB_PASS=secret$|CAMBIAR|CHANGE_ME'

POST_MSG="
  Chequeo profundo (mod_remoteip, cookies, permisos de las claves):
    /var/www/docker/bin/check-linkedcode-auth.sh"

# Destinatario del mail de prueba que se manda tras un deploy con cambios (o con
# --verify). Se puede pisar: DEPLOY_MAIL_TO=otro@x.com ./bin/linkedcode-auth.sh
DEPLOY_MAIL_TO="${DEPLOY_MAIL_TO:-nhk.web@gmail.com}"

# auth es la app que manda mails a través de ember: esto prueba el tramo
# auth -> ember (URL, API key, red shared_services) con el mismo MailApiService
# que usan los flujos reales. Que ember lo entregue por SMTP lo prueba el
# mail de prueba de ember.sh.
verify_extra() {
    local out

    if out=$(docker exec "linkedcode-auth" php bin/send-test-email.php "$DEPLOY_MAIL_TO" 2>&1); then
        ok "$out"
    else
        fail "auth no pudo encolar el mail en ember"
        echo "$out" | sed 's/^/           /'
    fi
}
