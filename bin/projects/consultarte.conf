# consultarte.com.ar — api, app, img, www
PROJECT="consultarte"
DOMAIN="consultarte.com.ar"

DATA_DIRS=(app img www logs)
WRITABLE_DIRS=(img logs)
SERVICES=(api app img www)

REPOS=("/var/www/consultarte/api|git@github-linkedcode:consultarte/api.git")
USES_COMPOSER=1
# api/app/img/www: composer y migraciones corren sólo en api.
MIGRATE_CONTAINER="consultarte-api"
# app/img/www son estáticos (Apache sirviendo un volumen): un cambio de
# código en api no los afecta, así que sólo se reinicia api.
RESTART_CONTAINERS=(consultarte-api)

# notenv: la app (secretos incluidos) se configura en config.prod.php, no en el
# env del compose, que sólo lleva APP_ENV / TZ / COMPOSER_AUTH. De ahí salen
# también las credenciales con que se verifica la base.
DB_SOURCE="config"
APP_CONFIG="/var/www/consultarte/api/config/config.prod.php"
REQUIRED_FILES=(
    "/var/www/consultarte/api/config/common.php|obligatorio para notenv (Loader::load): debería venir versionado con el repo"
    "/var/www/consultarte/api/config/config.prod.php|no se versiona: crearlo a mano con db, jwt, cors, oauth y URLs de producción"
)

ENV_HINT="COMPOSER_AUTH"
PLACEHOLDERS='^COMPOSER_AUTH=[[:space:]]*$|GITHUB_PAT_AQUI|ghp_xxx|CAMBIAR|CHANGE_ME'

POST_MSG="
  Recordá, si agregaste un subdominio nuevo:
    1. que el DNS (ej. img.${DOMAIN}) apunte al VPS
    2. reiniciar el gateway para activar el certificado nuevo:
         sudo systemctl restart docker-gateway.service"
