# justiciaparamargarita.ar — estático, un solo contenedor httpd; el contenido se sube por rsync
PROJECT="justiciaparamargarita"
DOMAIN="justiciaparamargarita.ar"

ROOT="/var/www/justiciaparamargarita"
COMPOSE="/var/www/docker/projects/justiciaparamargarita/compose/web.yml"

SERVICES=(web)
CONTAINERS=(justiciaparamargarita-web)

ENV_REQUIRED=0
NEEDS_MYSQL=0
NETWORKS=(projects_public)
DB_SOURCE="none"

# Sin REPOS: no hay git en el VPS, www/ llega por rsync.
DATA_DIRS=(www logs)
