# zurdosanonimos.com.ar — estático, un solo contenedor httpd sirviendo un repo git
PROJECT="zurdosanonimos"

ROOT="/var/www/zurdosanonimos"
COMPOSE="/var/www/docker/projects/zurdosanonimos/compose/web.yml"

SERVICES=(web)
CONTAINERS=(zurdosanonimos-web)

ENV_REQUIRED=0
NEEDS_MYSQL=0
NETWORKS=(projects_public)
DB_SOURCE="none"

REPOS=("/var/www/zurdosanonimos/www|git@github.com:zurdosanonimos/web.git")
