# www.linkedcode.com — estático (build de Vue)
#
# Comparte compose con auth, pero se nombra sólo el servicio www: un
# `up -d www` deja intacto a linkedcode-auth.
#
# No usa base de datos ni lee el env; el env se pasa igual porque docker compose
# lo necesita para interpolar las variables del servicio auth del mismo archivo.
PROJECT="linkedcode"

ROOT="/var/www/linkedcode"
COMPOSE="/var/www/docker/projects/linkedcode/compose/web.yml"
ENV_FILE="/var/www/docker/projects/linkedcode/env/web.env"

SERVICES=(www)
CONTAINERS=(linkedcode-www)

NEEDS_MYSQL=0
NETWORKS=(projects_public)
DB_SOURCE="none"

# El env no se valida acá (www no lo lee), pero tiene que existir. El patrón
# está hecho para no matchear nunca: ^$ dentro de una línea es imposible.
PLACEHOLDERS='^x^'

REQUIRED_FILES=(
    "/var/www/linkedcode/www.linkedcode.com/index.html|copiar el build de Vue o un index.html provisional"
)
