# impuestounico.com.ar — api, app, img, www
PROJECT="impuestounico"
DOMAIN="impuestounico.com.ar"

DATA_DIRS=(app img www logs)
WRITABLE_DIRS=(img)
SERVICES=(api app img www)

REPOS=("/var/www/impuestounico/api|git@github.com:impuestounico/api.git")
USES_COMPOSER=1
# api/app/img/www: composer y migraciones corren sólo en api. Coincide con el
# default del motor (primer CONTAINERS), pero se deja explícito por prolijidad.
MIGRATE_CONTAINER="impuestounico-api"
# app/img/www son estáticos (Apache sirviendo un volumen): un cambio de
# código en api no los afecta, así que sólo se reinicia api.
RESTART_CONTAINERS=(impuestounico-api)

DB_NAME="impuestounico"

ENV_HINT="JWT_SECRET / DB_USER / DB_PASS / COMPOSER_AUTH"
PLACEHOLDERS='^(JWT_SECRET|DB_PASS|COMPOSER_AUTH)=[[:space:]]*$|GITHUB_PAT_AQUI|CAMBIAR|CHANGE_ME'

POST_MSG="
  Recordá, si agregaste un subdominio nuevo:
    1. que el DNS (ej. img.${DOMAIN}) apunte al VPS
    2. reiniciar el gateway para activar el certificado nuevo:
         sudo systemctl restart docker-gateway.service"
