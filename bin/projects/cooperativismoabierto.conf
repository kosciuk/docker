# cooperativismoabierto.com.ar — api, app, img, www
PROJECT="cooperativismoabierto"
DOMAIN="cooperativismoabierto.com.ar"

DATA_DIRS=(app img www logs)
WRITABLE_DIRS=(img)
SERVICES=(api app img www)

REPOS=("/var/www/cooperativismoabierto/api|git@github.com:cooperativismoabierto/api.git")
USES_COMPOSER=1
# app/img/www son estáticos (Apache sirviendo un volumen): un cambio de
# código en api no los afecta, así que sólo se reinicia api.
RESTART_CONTAINERS=(cooperativismoabierto-api)

DB_NAME="cooperativismoabierto"

ENV_HINT="JWT_SECRET / DB_PASS / COMPOSER_AUTH"
PLACEHOLDERS='^(JWT_SECRET|DB_PASS|COMPOSER_AUTH)=[[:space:]]*$|GITHUB_PAT_AQUI|CAMBIAR|CHANGE_ME'

POST_MSG="
  Recordá, si agregaste un subdominio nuevo:
    1. que el DNS (ej. img.${DOMAIN}) apunte al VPS
    2. reiniciar el gateway para activar el certificado nuevo:
         sudo systemctl restart docker-gateway.service"
