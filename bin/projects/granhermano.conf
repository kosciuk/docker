# granhermano.com.ar — estático, un solo contenedor httpd sirviendo un repo git
PROJECT="granhermano"

ROOT="/var/www/granhermano"
COMPOSE="/var/www/docker/projects/granhermano/compose/web.yml"

SERVICES=(web)
CONTAINERS=(granhermano-web)

ENV_REQUIRED=0
NEEDS_MYSQL=0
NETWORKS=(projects_public)
DB_SOURCE="none"

REPOS=("/var/www/granhermano/www|git@github.com:granhermano-com-ar/www.git")
