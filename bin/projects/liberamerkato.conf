# liberamerkato.com — api, app, img, www
PROJECT="liberamerkato"
DOMAIN="liberamerkato.com"

DATA_DIRS=(app img www logs)
WRITABLE_DIRS=(img)
SERVICES=(api app img www)

REPOS=("/var/www/liberamerkato/api|git@github-linkedcode:liberamerkato/api.git")

ENV_HINT="DB_USER / DB_PASS / JWT_SECRET / COMPOSER_AUTH"
PLACEHOLDERS='^(DB_PASS|JWT_SECRET|COMPOSER_AUTH)=[[:space:]]*$|change-me|ghp_xxx|CAMBIAR|CHANGE_ME'

POST_MSG="
  Recordá, si agregaste un subdominio nuevo:
    1. que el DNS (ej. img.${DOMAIN}) apunte al VPS
    2. reiniciar el gateway para activar el certificado nuevo:
         sudo systemctl restart docker-gateway.service"
