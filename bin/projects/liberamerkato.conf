# liberamerkato.com — api, app, img, www
PROJECT="liberamerkato"
DOMAIN="liberamerkato.com"

DATA_DIRS=(app img www logs)
WRITABLE_DIRS=(img)
SERVICES=(api app img www)

REPOS=("/var/www/liberamerkato/api|git@github-linkedcode:liberamerkato/api.git")

# DB_PASS ya no está en el env: la conexión sale de config.php.
ENV_HINT="COMPOSER_AUTH"
PLACEHOLDERS='^(COMPOSER_AUTH)=[[:space:]]*$|change-me|ghp_xxx|CAMBIAR|CHANGE_ME'

# La API no arma la conexión con variables de entorno: config/common.php fija
# el host y eso se pisa desde config/config.php, que no se versiona.
DB_SOURCE="config"
APP_CONFIG="/var/www/liberamerkato/api/config/config.php"

REQUIRED_FILES=(
    "${APP_CONFIG}|no se versiona: crearlo con host 'shared-mysql' (ver README)"
)

# Dentro del contenedor no hay MySQL en localhost: es el error silencioso
# típico (contenedor arriba, error 500 al primer request).
check_extra() {
    section "Config de la API"
    if [ ! -f "$APP_CONFIG" ]; then
        : # ya lo reportó REQUIRED_FILES
    elif grep -qE "'host'[[:space:]]*=>[[:space:]]*'(localhost|127\.0\.0\.1)'" "$APP_CONFIG"; then
        fail "config.php apunta a localhost: dentro del contenedor no hay MySQL ahí"
        echo "           usar 'host' => 'shared-mysql'"
    else
        ok "config.php sin host localhost"
    fi
}

POST_MSG="
  Recordá, si agregaste un subdominio nuevo:
    1. que el DNS (ej. img.${DOMAIN}) apunte al VPS
    2. reiniciar el gateway para activar el certificado nuevo:
         sudo systemctl restart docker-gateway.service"
