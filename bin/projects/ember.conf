# ember.linkedcode.com — servicio interno de envío de mails
#
# Ember NO pasa por el gateway: sólo vive en shared_services, y lo consumen las
# otras apps por HTTP interno.
PROJECT="ember"

ROOT="/var/www/linkedcode/ember.linkedcode.com"
NEEDS_GATEWAY=0
NETWORKS=(shared_services)
SERVICES=(app)
CONTAINERS=(ember-app)

REPOS=("/var/www/linkedcode/ember.linkedcode.com|git@github.com:linkedcode/ember.git")

ENV_HINT="DB_USER / DB_PASS / SMTP_PASS_KEY / COMPOSER_AUTH"
PLACEHOLDERS='^(DB_PASS|COMPOSER_AUTH|SMTP_PASS_KEY)=[[:space:]]*$|GITHUB_PAT_AQUI|cambia_esto|^DB_PASS=secret$|CAMBIAR|CHANGE_ME'

# El timer es la red de seguridad: los envíos con send_immediately=1 salen en el
# mismo request, pero si eso falla el mensaje queda pendiente y sólo lo levanta
# el cron. Un stack sin timer parece sano y pierde esos reenvíos.
SYSTEMD_UNITS=(docker-ember-cron.timer)

# SMTP_PASS_KEY cifra las contraseñas SMTP guardadas en la base. Si es corta el
# cifrado es débil, y si se cambia después ya no se pueden descifrar las que
# había: mejor detectarlo antes de levantar.
check_extra() {
    [ -f "$ENV_FILE" ] || return 0
    local key
    key=$(sed -n 's/^SMTP_PASS_KEY=//p' "$ENV_FILE" | tr -d '"'"'"'')
    [ -n "$key" ] || return 0

    section "Clave SMTP"
    if [ "${#key}" -lt 32 ]; then
        fail "SMTP_PASS_KEY tiene ${#key} caracteres (se esperan 32+)"
    else
        ok "SMTP_PASS_KEY con largo suficiente (${#key})"
    fi
}
