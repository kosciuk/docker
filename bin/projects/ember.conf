# ember.linkedcode.com — servicio interno de envío de mails
#
# Ember NO pasa por el gateway: sólo vive en shared_services, y lo consumen las
# otras apps por HTTP interno.
PROJECT="ember"

ROOT="/var/www/linkedcode/ember.linkedcode.com"
NEEDS_GATEWAY=0
NETWORKS=(shared_services)
SERVICES=(app)
CONTAINERS=(ember-app)

REPOS=("/var/www/linkedcode/ember.linkedcode.com|git@github.com:linkedcode/ember.git")
USES_COMPOSER=1
# El contenedor de ember es ember-app (SERVICES=(app)), no ember-api: el
# default del motor no sirve acá.
MIGRATE_CONTAINER="ember-app"

# var/ está en el .gitignore del repo, así que un clon nuevo no la trae. Sin
# var/log el logger (Monolog) tira "There is no existing directory" en la primera
# request que lo usa -- /health no lo instancia y da 200 igual, pero POST
# /api/emails responde 500 sin cuerpo. También escribe var/queue.flag y var/cache.
DATA_DIRS=(var var/log var/cache)
WRITABLE_DIRS=(var var/log var/cache)
# ember loguea en var/log, no en logs/ (lo lee bin/vps-errors.sh).
LOGS_DIR="${ROOT}/var/log"

ENV_HINT="DB_USER / DB_PASS / SMTP_PASS_KEY / COMPOSER_AUTH"
PLACEHOLDERS='^(DB_PASS|COMPOSER_AUTH|SMTP_PASS_KEY)=[[:space:]]*$|GITHUB_PAT_AQUI|cambia_esto|^DB_PASS=secret$|CAMBIAR|CHANGE_ME'

# El timer es la red de seguridad: los envíos con send_immediately=1 salen en el
# mismo request, pero si eso falla el mensaje queda pendiente y sólo lo levanta
# el cron. Un stack sin timer parece sano y pierde esos reenvíos.
SYSTEMD_UNITS=(docker-ember-cron.timer)

# SMTP_PASS_KEY cifra las contraseñas SMTP guardadas en la base. Si es corta el
# cifrado es débil, y si se cambia después ya no se pueden descifrar las que
# había: mejor detectarlo antes de levantar.
check_extra() {
    [ -f "$ENV_FILE" ] || return 0
    local key
    key=$(sed -n 's/^SMTP_PASS_KEY=//p' "$ENV_FILE" | tr -d '"'"'"'')
    [ -n "$key" ] || return 0

    section "Clave SMTP"
    if [ "${#key}" -lt 32 ]; then
        fail "SMTP_PASS_KEY tiene ${#key} caracteres (se esperan 32+)"
    else
        ok "SMTP_PASS_KEY con largo suficiente (${#key})"
    fi
}

# Destinatario del mail de prueba que se manda tras un deploy con cambios (o con
# --verify). Se puede pisar: DEPLOY_MAIL_TO=otro@x.com ./bin/ember.sh
DEPLOY_MAIL_TO="${DEPLOY_MAIL_TO:-nhk.web@gmail.com}"

# Que el contenedor levante no prueba que el SMTP ande: un envío real sí.
# send-test-email.sh usa --send, así que sale por SMTP en el momento (no queda
# esperando al cron) y falla con código 1 si el SMTP rechaza.
verify_extra() {
    local script="${ROOT}/bin/send-test-email.sh"

    if [ ! -x "$script" ]; then
        warn "no encuentro ${script}: no se pudo mandar el mail de prueba"
        return
    fi

    if "$script" "$DEPLOY_MAIL_TO"; then
        ok "mail de prueba enviado a ${DEPLOY_MAIL_TO}"
    else
        fail "el mail de prueba falló (SMTP de ember) -> docker logs ember-app"
    fi
}
