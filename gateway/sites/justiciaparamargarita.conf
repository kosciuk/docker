# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain justiciaparamargarita.ar www.justiciaparamargarita.ar

<VirtualHost *:80>
    ServerName justiciaparamargarita.ar
    ServerAlias www.justiciaparamargarita.ar
    ErrorLog /var/www/justiciaparamargarita/logs/error.log
    CustomLog /var/www/justiciaparamargarita/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://justiciaparamargarita.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.justiciaparamargarita.ar
    ErrorLog /var/www/justiciaparamargarita/logs/error.log
    CustomLog /var/www/justiciaparamargarita/logs/access.log combined
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://justiciaparamargarita.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName justiciaparamargarita.ar
    ErrorLog /var/www/justiciaparamargarita/logs/error.log
    CustomLog /var/www/justiciaparamargarita/logs/access.log combined
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://justiciaparamargarita-web/
    ProxyPassReverse / http://justiciaparamargarita-web/
</VirtualHost>
