MDomain consultarte.com.ar www.consultarte.com.ar api.consultarte.com.ar app.consultarte.com.ar img.consultarte.com.ar

# consultarte.com.ar → www (HTTP)
<VirtualHost *:80>
    ServerName consultarte.com.ar
    ServerAlias www.consultarte.com.ar
    ErrorLog /var/www/consultarte/logs/error.log
    CustomLog /var/www/consultarte/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://www.consultarte.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

