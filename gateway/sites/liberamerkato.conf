# Local
<VirtualHost *:80>
    ServerName api.liberamerkato.local
    ProxyPreserveHost On
    ProxyPass / http://liberamerkato-api/
    ProxyPassReverse / http://liberamerkato-api/
</VirtualHost>

<VirtualHost *:80>
    ServerName img.liberamerkato.local
    DocumentRoot /srv/liberamerkato/img
    <Directory /srv/liberamerkato/img>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName liberamerkato.local
    ServerAlias www.liberamerkato.local
    DocumentRoot /srv/liberamerkato/app
    FallbackResource /index.html
    <Directory /srv/liberamerkato/app>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName app.liberamerkato.local
    DocumentRoot /srv/liberamerkato/app
    FallbackResource /index.html
    <Directory /srv/liberamerkato/app>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

# Producción — mod_md obtiene los certificados Let's Encrypt automáticamente
MDomain liberamerkato.com api.liberamerkato.com img.liberamerkato.com app.liberamerkato.com www.liberamerkato.com

<VirtualHost *:80>
    ServerName liberamerkato.com
    ServerAlias www.liberamerkato.com api.liberamerkato.com img.liberamerkato.com app.liberamerkato.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.liberamerkato.com
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://liberamerkato-api/
    ProxyPassReverse / http://liberamerkato-api/
</VirtualHost>

<VirtualHost *:443>
    ServerName img.liberamerkato.com
    SSLEngine On
    DocumentRoot /srv/liberamerkato/img
    <Directory /srv/liberamerkato/img>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName liberamerkato.com
    ServerAlias www.liberamerkato.com
    SSLEngine On
    DocumentRoot /srv/liberamerkato/app
    FallbackResource /index.html
    <Directory /srv/liberamerkato/app>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerName app.liberamerkato.com
    SSLEngine On
    DocumentRoot /srv/liberamerkato/app
    FallbackResource /index.html
    <Directory /srv/liberamerkato/app>
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>
