# Local
<VirtualHost *:80>
    ServerName www.partidodelasoledad.local
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-web/
    ProxyPassReverse / http://partidodelasoledad-web/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain partidodelasoledad.com.ar www.partidodelasoledad.com.ar

<VirtualHost *:80>
    ServerName partidodelasoledad.com.ar
    ServerAlias www.partidodelasoledad.com.ar
    RewriteEngine On
    RewriteRule ^ https://www.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName partidodelasoledad.com.ar
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://www.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.partidodelasoledad.com.ar
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-web/
    ProxyPassReverse / http://partidodelasoledad-web/
</VirtualHost>
