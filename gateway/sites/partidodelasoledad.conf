# Local
<VirtualHost *:80>
    ServerName www.partidodelasoledad.local
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-www/
    ProxyPassReverse / http://partidodelasoledad-www/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain partidodelasoledad.com.ar www.partidodelasoledad.com.ar api.partidodelasoledad.com.ar app.partidodelasoledad.com.ar img.partidodelasoledad.com.ar

<VirtualHost *:80>
    ServerName partidodelasoledad.com.ar
    ServerAlias www.partidodelasoledad.com.ar
    RewriteEngine On
    RewriteRule ^ https://www.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

# api.partidodelasoledad.com.ar (HTTP)
<VirtualHost *:80>
    ServerName api.partidodelasoledad.com.ar
    RewriteEngine On
    RewriteRule ^ https://api.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

# app.partidodelasoledad.com.ar (HTTP)
<VirtualHost *:80>
    ServerName app.partidodelasoledad.com.ar
    RewriteEngine On
    RewriteRule ^ https://app.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

# img.partidodelasoledad.com.ar (HTTP)
<VirtualHost *:80>
    ServerName img.partidodelasoledad.com.ar
    RewriteEngine On
    RewriteRule ^ https://img.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName partidodelasoledad.com.ar
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://www.partidodelasoledad.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

# www.partidodelasoledad.com.ar (HTTPS)
<VirtualHost *:443>
    ServerName www.partidodelasoledad.com.ar
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-www/
    ProxyPassReverse / http://partidodelasoledad-www/
</VirtualHost>

# api.partidodelasoledad.com.ar (HTTPS)
<VirtualHost *:443>
    ServerName api.partidodelasoledad.com.ar
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-api/
    ProxyPassReverse / http://partidodelasoledad-api/
</VirtualHost>

# app.partidodelasoledad.com.ar (HTTPS) — SPA Vue (dist)
<VirtualHost *:443>
    ServerName app.partidodelasoledad.com.ar
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-app/
    ProxyPassReverse / http://partidodelasoledad-app/
</VirtualHost>

# img.partidodelasoledad.com.ar (HTTPS) — uploads
<VirtualHost *:443>
    ServerName img.partidodelasoledad.com.ar
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://partidodelasoledad-img/
    ProxyPassReverse / http://partidodelasoledad-img/
</VirtualHost>
