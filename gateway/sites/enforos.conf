# enforos.net → www (HTTPS)
<VirtualHost *:443>
    ServerName enforos.net
    ErrorLog /var/www/enforos/logs/error.log
    CustomLog /var/www/enforos/logs/access.log combined
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://www.enforos.net%{REQUEST_URI} [R=301,L]
</VirtualHost>

# www.enforos.net (HTTPS) — redirige a app (por ahora)
<VirtualHost *:443>
    ServerName www.enforos.net
    ErrorLog /var/www/enforos/logs/error.log
    CustomLog /var/www/enforos/logs/access.log combined
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://enforos-www/
    ProxyPassReverse / http://enforos-www/
</VirtualHost>

# api.enforos.net (HTTPS)
