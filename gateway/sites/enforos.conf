MDomain enforos.net www.enforos.net api.enforos.net app.enforos.net img.enforos.net

# enforos.net → www (HTTP)
<VirtualHost *:80>
    ServerName enforos.net
    ServerAlias www.enforos.net
    ErrorLog /var/www/enforos/logs/error.log
    CustomLog /var/www/enforos/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://www.enforos.net%{REQUEST_URI} [R=301,L]
</VirtualHost>

