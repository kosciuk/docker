# Local
<VirtualHost *:80>
    ServerName granhermano.local
    ErrorLog /var/www/granhermano/logs/error.log
    CustomLog /var/www/granhermano/logs/access.log combined
    ProxyPreserveHost On
    ProxyPass / http://granhermano-web/
    ProxyPassReverse / http://granhermano-web/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain granhermano.com.ar www.granhermano.com.ar

<VirtualHost *:80>
    ServerName granhermano.com.ar
    ServerAlias www.granhermano.com.ar
    ErrorLog /var/www/granhermano/logs/error.log
    CustomLog /var/www/granhermano/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://granhermano.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.granhermano.com.ar
    ErrorLog /var/www/granhermano/logs/error.log
    CustomLog /var/www/granhermano/logs/access.log combined
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://granhermano.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName granhermano.com.ar
    ErrorLog /var/www/granhermano/logs/error.log
    CustomLog /var/www/granhermano/logs/access.log combined
    SSLEngine On

    RewriteEngine On

    # 1. Bloqueo de rangos de Datacenters de Scraping (Oracle SG, DataForSEO, Proxies, AWS)
    RewriteCond %{REMOTE_ADDR} ^141\.148\. [OR]
    RewriteCond %{REMOTE_ADDR} ^132\.226\. [OR]
    RewriteCond %{REMOTE_ADDR} ^129\.153\. [OR]
    RewriteCond %{REMOTE_ADDR} ^161\.153\. [OR]
    RewriteCond %{REMOTE_ADDR} ^195\.178\.110\. [OR]
    RewriteCond %{REMOTE_ADDR} ^45\.148\.10\. [OR]
    RewriteCond %{REMOTE_ADDR} ^93\.123\.109\. [OR]
    RewriteCond %{REMOTE_ADDR} ^16\.216\.88\. [OR]
    # 2. Bloqueo por User-Agent de bots conocidos
    RewriteCond %{HTTP_USER_AGENT} (AionBot|DataForSeoBot|Reflectionbot|SemrushBot|DotBot|MJ12bot|PetalBot|Bytespider|GPTBot|ClaudeBot|CCBot|PerplexityBot) [NC,OR]
    # 3. Bloqueo de scrapers headless que simulan Chrome (versión .0.0.0)
    RewriteCond %{HTTP_USER_AGENT} "Chrome/[0-9]+\.0\.0\.0" [NC]
    RewriteRule ^ - [F,L]

    ProxyPreserveHost On
    ProxyPass / http://granhermano-web/
    ProxyPassReverse / http://granhermano-web/
</VirtualHost>
