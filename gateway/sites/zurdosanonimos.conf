# Local
<VirtualHost *:80>
    ServerName zurdosanonimos.local
    ErrorLog /var/www/zurdosanonimos/logs/error.log
    CustomLog /var/www/zurdosanonimos/logs/access.log combined
    ProxyPreserveHost On
    ProxyPass / http://zurdosanonimos-web/
    ProxyPassReverse / http://zurdosanonimos-web/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain zurdosanonimos.com.ar www.zurdosanonimos.com.ar

<VirtualHost *:80>
    ServerName zurdosanonimos.com.ar
    ServerAlias www.zurdosanonimos.com.ar
    ErrorLog /var/www/zurdosanonimos/logs/error.log
    CustomLog /var/www/zurdosanonimos/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://zurdosanonimos.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.zurdosanonimos.com.ar
    ErrorLog /var/www/zurdosanonimos/logs/error.log
    CustomLog /var/www/zurdosanonimos/logs/access.log combined
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://zurdosanonimos.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName zurdosanonimos.com.ar
    ErrorLog /var/www/zurdosanonimos/logs/error.log
    CustomLog /var/www/zurdosanonimos/logs/access.log combined
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://zurdosanonimos-web/
    ProxyPassReverse / http://zurdosanonimos-web/
</VirtualHost>
