# Local
<VirtualHost *:80>
    ServerName cooperativismoabierto.local
    ServerAlias www.cooperativismoabierto.local
    ErrorLog /var/www/cooperativismoabierto/logs/error.log
    CustomLog /var/www/cooperativismoabierto/logs/access.log combined
    ProxyPreserveHost On
    ProxyPass / http://cooperativismoabierto-www/
    ProxyPassReverse / http://cooperativismoabierto-www/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain cooperativismoabierto.com.ar www.cooperativismoabierto.com.ar api.cooperativismoabierto.com.ar app.cooperativismoabierto.com.ar img.cooperativismoabierto.com.ar

<VirtualHost *:80>
    ServerName cooperativismoabierto.com.ar
    ServerAlias www.cooperativismoabierto.com.ar
    ErrorLog /var/www/cooperativismoabierto/logs/error.log
    CustomLog /var/www/cooperativismoabierto/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://www.cooperativismoabierto.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

