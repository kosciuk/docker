# Local
<VirtualHost *:80>
    ServerName cooperativismoabierto.local
    ProxyPreserveHost On
    ProxyPass / http://cooperativismoabierto-web/
    ProxyPassReverse / http://cooperativismoabierto-web/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain cooperativismoabierto.com.ar www.cooperativismoabierto.com.ar

<VirtualHost *:80>
    ServerName cooperativismoabierto.com.ar
    ServerAlias www.cooperativismoabierto.com.ar
    RewriteEngine On
    RewriteRule ^ https://cooperativismoabierto.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.cooperativismoabierto.com.ar
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://cooperativismoabierto.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName cooperativismoabierto.com.ar
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://cooperativismoabierto-web/
    ProxyPassReverse / http://cooperativismoabierto-web/
</VirtualHost>
