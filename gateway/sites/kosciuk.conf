# Local
<VirtualHost *:80>
    ServerName kosciuk.local
    ErrorLog /var/www/kosciuk/logs/error.log
    CustomLog /var/www/kosciuk/logs/access.log combined
    ProxyPreserveHost On
    ProxyPass / http://kosciuk-web/
    ProxyPassReverse / http://kosciuk-web/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain kosciuk.com.ar www.kosciuk.com.ar

<VirtualHost *:80>
    ServerName kosciuk.com.ar
    ServerAlias www.kosciuk.com.ar
    ErrorLog /var/www/kosciuk/logs/error.log
    CustomLog /var/www/kosciuk/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://kosciuk.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.kosciuk.com.ar
    ErrorLog /var/www/kosciuk/logs/error.log
    CustomLog /var/www/kosciuk/logs/access.log combined
    SSLEngine On
    RewriteEngine On
    RewriteRule ^ https://kosciuk.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName kosciuk.com.ar
    ErrorLog /var/www/kosciuk/logs/error.log
    CustomLog /var/www/kosciuk/logs/access.log combined
    SSLEngine On
    ProxyPreserveHost On
    ProxyPass / http://kosciuk-web/
    ProxyPassReverse / http://kosciuk-web/
</VirtualHost>
