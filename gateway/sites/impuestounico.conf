# Local
<VirtualHost *:80>
    ServerName www.impuestounico.local
    ErrorLog /var/www/impuestounico/logs/error.log
    CustomLog /var/www/impuestounico/logs/access.log combined
    ProxyPreserveHost On
    ProxyPass / http://impuestounico-www/
    ProxyPassReverse / http://impuestounico-www/
</VirtualHost>

# Producción — mod_md obtiene el certificado Let's Encrypt automáticamente
MDomain impuestounico.com.ar www.impuestounico.com.ar api.impuestounico.com.ar app.impuestounico.com.ar img.impuestounico.com.ar

<VirtualHost *:80>
    ServerName impuestounico.com.ar
    ServerAlias www.impuestounico.com.ar
    ErrorLog /var/www/impuestounico/logs/error.log
    CustomLog /var/www/impuestounico/logs/access.log combined
    RewriteEngine On
    RewriteRule ^ https://www.impuestounico.com.ar%{REQUEST_URI} [R=301,L]
</VirtualHost>

# api.impuestounico.com.ar (HTTP)
<VirtualHost *:80>
